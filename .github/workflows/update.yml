name: update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "强制重算今天的收盘数据"
        type: boolean
        default: false
  schedule:
    # 北京时间 15:50 / 17:30 / 20:30（GitHub 定时常延迟，多排两次兜底；已处理过的日子会自动跳过）
    - cron: "50 7 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests==2.32.3 openpyxl==3.1.5

      - name: 取出滚动状态（state 分支）
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state; then git archive FETCH_HEAD | tar -x -C state; fi
          ls -la state

      - name: 更新数据
        env:
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then python scripts/run.py --force; else python scripts/run.py; fi

      - name: 保存数据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A web/data concepts_src inbox config
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 北京"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi

      - name: 保存滚动状态（覆盖 state 分支，不留历史）
        run: |
          if [ -f state/state.json.gz ]; then
            cd state
            git init -q
            git checkout -q -b state
            git add -A
            git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "state"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - uses: actions/deploy-pages@v4
